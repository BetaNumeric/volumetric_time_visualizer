<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volumetric Time Visualizer v1.2</title>
    <!-- Three.js -->
    <script src="./vendor/three-r128.min.js"></script>
    <!-- OrbitControls -->
    <script src="./vendor/OrbitControls-r128.js"></script>
    <script src="./js/volume-core.js"></script>
    
    <link rel="stylesheet" href="./styles/tailwind.css">
    <link rel="stylesheet" href="./styles/app.css">
</head>
<body>

    <button id="openSettingsBtn" type="button" class="absolute top-4 left-4 z-20 p-2 bg-gray-900/90 hover:bg-gray-800 border border-gray-800 rounded-lg shadow-2xl text-gray-300 hover:text-white transition-all duration-300 opacity-0 pointer-events-none scale-90" aria-label="Open settings">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    </button>

    <div id="mainPanel" class="absolute top-4 left-4 z-30 w-80 max-h-[calc(100vh-2rem)] flex flex-col bg-gray-900/90 backdrop-blur-md rounded-xl shadow-2xl border border-gray-800 overflow-hidden transition-all duration-300 origin-top-left opacity-100 scale-100">
        <div class="flex items-center justify-between px-3 py-2 bg-black/40 border-b border-gray-800">
            <div class="flex items-center gap-2 min-w-0">
                <h1 class="text-xs font-bold text-gray-100 tracking-wide truncate">Volumetric Time</h1>
                <span class="text-[10px] font-bold text-blue-300 bg-blue-900/20 border border-blue-900/30 rounded px-1.5 py-0.5">Stack</span>
            </div>
            <button id="closePanelBtn" type="button" class="text-gray-400 hover:text-white transition-colors" aria-label="Close settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div id="view-controls" class="p-2 bg-black/25 border-b border-gray-800 shrink-0">
            <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white transition-colors bg-gray-900/50 border border-gray-800 rounded px-2 py-1.5">
                    <span>Display Volume</span>
                    <input type="checkbox" id="boxToggle" checked class="w-3 h-3 rounded bg-gray-700 border-gray-600">
                </label>
                <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white transition-colors bg-gray-900/50 border border-gray-800 rounded px-2 py-1.5">
                    <span>Orthographic</span>
                    <input type="checkbox" id="orthoToggle" class="w-3 h-3 rounded bg-gray-700 border-gray-600">
                </label>
            </div>
            <div id="orthoViewButtons" class="hidden grid grid-cols-1 gap-1 mt-2">
                <button type="button" id="topDownViewBtn" class="py-1 px-2 rounded text-[10px] font-bold text-gray-300 bg-gray-900 hover:bg-gray-800 hover:text-white transition-colors">Top Down</button>
            </div>
        </div>

        <div id="panel-content" class="p-3 space-y-3 flex-1 min-h-0 overflow-y-auto">
            <div class="space-y-2 pb-3 border-b border-gray-800">
                <label for="presetSelect" class="text-xs font-bold uppercase text-gray-500 block">Render presets</label>
                <select id="presetSelect"><option value="">Choose a preset</option></select>
                <input id="presetName" type="text" maxlength="64" placeholder="Preset name" aria-label="Preset name" class="w-full bg-gray-800 rounded px-2 py-1 text-xs">
                <div class="grid grid-cols-3 gap-2">
                    <button id="applyPresetBtn" type="button" class="bg-gray-800 rounded p-1 text-xs">Apply</button>
                    <button id="savePresetBtn" type="button" class="bg-gray-800 rounded p-1 text-xs">Save</button>
                    <button id="deletePresetBtn" type="button" class="bg-gray-800 rounded p-1 text-xs">Delete</button>
                </div>
                <p id="settingsStatus" role="status" class="text-[10px] text-gray-400"></p>
            </div>
            <div class="space-y-3 pb-3 border-b border-gray-800">
                <label class="text-xs font-bold uppercase text-gray-500 block">Source</label>

                <div class="space-y-1">
                    <div class="flex justify-between text-xs text-gray-400">
                        <span>Trim</span>
                        <span id="trimValues" class="font-mono text-[10px] text-blue-300">0.0s - 0.0s</span>
                    </div>
                    <div id="trimRangeControl" class="dual-range" aria-label="Trim range">
                        <div class="dual-range-track">
                            <div id="trimRangeFill" class="dual-range-fill" style="left: 0%; right: 0%;"></div>
                        </div>
                        <button type="button" id="trimStartHandle" class="dual-range-handle trim-start" aria-label="Trim start"></button>
                        <button type="button" id="trimEndHandle" class="dual-range-handle trim-end" aria-label="Trim end"></button>
                        <input type="hidden" id="trimStart" min="0" max="100" value="0" step="any" class="trim-hidden-input">
                        <input type="hidden" id="trimEnd" min="0" max="100" value="100" step="any" class="trim-hidden-input">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">FPS</label>
                        <select id="fpsSelect">
                            <option value="24">24</option>
                            <option value="25">25</option>
                            <option value="30" selected>30</option>
                            <option value="48">48</option>
                            <option value="60">60</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Max Res</label>
                        <select id="resolutionSelect">
                            <option value="400">Low</option>
                            <option value="800" selected>Med</option>
                            <option value="1200">High</option>
                            <option value="2160">Ultra</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="controlsArea" class="space-y-3 transition-opacity duration-300">
                <p id="memoryEstimate" class="text-[10px] text-gray-400" aria-live="polite"></p>
                <p id="regenerateHint" class="text-[10px] text-amber-300" role="status"></p>
                <div class="space-y-3 pb-3 border-b border-gray-800">
                    <label class="text-xs font-bold uppercase text-gray-500 block">Playback</label>

                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Mode</label>
                        <select id="playbackMode">
                            <option value="static" selected>Static Stack</option>
                            <option value="scan">Scanning Slice</option>
                            <option value="build">Progressive Build</option>
                        </select>
                    </div>

                    <div id="animationControls" class="hidden space-y-3">
                        <div class="grid grid-cols-[1fr_auto] gap-2">
                            <button id="playPauseBtn" class="py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs text-white font-bold shadow transition-colors">
                                Play
                            </button>
                            <button id="resetAnimBtn" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded text-xs text-white border border-gray-700 transition-colors" title="Reset Animation">
                                Reset
                            </button>
                        </div>

                        <div class="space-y-1">
                            <div class="flex items-center justify-between">
                                <label class="text-[10px] font-bold uppercase text-gray-500">Timeline</label>
                                <label class="flex items-center gap-1.5 text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                                    <span>Loop</span>
                                    <input type="checkbox" id="loopToggle" checked class="w-3 h-3 rounded bg-gray-700 border-gray-600">
                                </label>
                            </div>
                            <input type="range" id="timeline" min="0" max="100" value="0" step="0.1" class="accent-blue-500">
                        </div>

                        <div class="space-y-1">
                            <div class="flex justify-between text-xs">
                                <label class="text-gray-400">Speed</label>
                                <div class="flex items-center gap-1">
                                    <input type="number" id="speedVal" min="0.1" max="3.0" value="1.0" step="0.1" class="value-input">
                                    <span class="text-[10px] text-gray-500 font-bold">x</span>
                                </div>
                            </div>
                            <input type="range" id="speed" min="0.1" max="3.0" value="1.0" step="0.1">
                        </div>
                    </div>

                    <div id="scanOptions" class="hidden flex-col space-y-2 bg-gray-800/40 p-2 rounded border border-gray-800">
                        <label class="flex items-center justify-between text-[10px] font-bold text-gray-400 cursor-pointer hover:text-white">
                            <span>Smooth Motion</span>
                            <input type="checkbox" id="smoothMotionToggle" class="w-3 h-3 rounded bg-gray-700 border-gray-600">
                        </label>
                        <label class="flex items-center justify-between text-[10px] text-gray-400">
                            <span>Blend adjacent slices</span>
                            <input type="checkbox" id="interpolateToggle">
                        </label>
                        <div class="flex items-center justify-between">
                            <label class="flex items-center gap-2 text-[10px] font-bold text-blue-300 cursor-pointer hover:text-blue-200" title="Viewport-buffer accumulation while scanning">
                                <span>Viewport Trail</span>
                                <input type="checkbox" id="lightPaintToggle" class="w-3 h-3 rounded bg-gray-700 border-gray-600">
                            </label>
                            <button id="clearPaintBtn" class="px-2 py-0.5 bg-gray-800 hover:bg-gray-700 text-gray-300 text-[10px] font-bold rounded border border-gray-700 transition-colors" title="Clear Canvas">
                                Clear
                            </button>
                        </div>
                    </div>

                    <div id="exposureOptions" class="flex flex-col space-y-2 bg-gray-800/40 p-2 rounded border border-gray-800">
                        <label for="exposureModel" class="text-[10px] text-gray-400">Exposure model</label>
                        <select id="exposureModel"><option value="artistic">Artistic preview</option><option value="linear">Linear-light estimate</option></select>
                        <label for="exposureDuration" class="text-[10px] text-gray-400">Sweep duration (s, 0 = source timing)</label>
                        <input id="exposureDuration" type="number" min="0" max="3600" step="0.1" value="0" class="value-input">
                        <p class="text-[10px] text-gray-500">Linear light estimates accumulated light over the sweep. Monitor glow, reflections and camera response still vary.</p>
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] text-gray-500 uppercase font-bold">Exposure</span>
                            <span id="exposureStatus" class="text-[10px] text-gray-500 font-mono">NEEDS BAKE</span>
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs">
                                <label class="text-gray-400">Samples / Frame</label>
                                <input type="number" id="exposureSamplesVal" min="1" max="60" value="30" step="1" class="value-input">
                            </div>
                            <input type="range" id="exposureSamples" min="1" max="60" value="30" step="1">
                        </div>
                        <button id="bakeExposureBtn" class="w-full py-1.5 bg-gray-800 hover:bg-gray-700 rounded text-xs text-white border border-gray-700 transition-colors font-bold">
                            Bake Current View
                        </button>
                    </div>
                </div>

                <div class="space-y-3 pb-3 border-b border-gray-800">
                    <label class="text-xs font-bold uppercase text-gray-500 block">Geometry</label>
                    <button id="resetGeometryBtn" type="button" class="bg-gray-800 rounded p-1 text-xs">Reset geometry to source</button>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <label class="text-gray-400">Frames</label>
                            <input type="number" id="frameCountVal" min="1" max="1320" value="660" step="1" class="value-input">
                        </div>
                        <input type="range" id="frameCount" min="1" max="1320" value="660" step="1">
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <label class="text-gray-400">Spacing (cm)</label>
                            <div class="flex items-center gap-1.5">
                                <button id="fitSpacingBtn" class="px-2 py-0.5 bg-blue-900/30 hover:bg-blue-800/60 text-blue-200 text-[10px] font-bold rounded border border-blue-900/40 transition-colors">
                                    Fit
                                </button>
                                <input type="number" id="spacingVal" min="0" max="48" value="0.1" step="0.0001" class="value-input">
                            </div>
                        </div>
                        <input type="range" id="spacing" min="0" max="48" value="0.1" step="0.0001">
                    </div>

                    <div id="sequenceGeometryTools" class="hidden space-y-2 bg-gray-800/40 p-2 rounded border border-gray-800">
                        <div class="flex justify-between text-xs">
                            <span class="text-gray-400">Bounds</span>
                            <span id="sequenceBoundsVal" class="text-blue-300 font-mono">0.00 - 48.00 cm</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold">Align</label>
                                <select id="sequenceAlign">
                                    <option value="bottom" selected>Bottom</option>
                                    <option value="center">Center</option>
                                    <option value="custom">Custom</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] text-gray-500 uppercase font-bold">JSON</label>
                                <button id="exportSequenceJsonBtn" class="w-full py-1.5 bg-gray-800 hover:bg-gray-700 rounded text-xs text-white border border-gray-700 transition-colors font-bold">
                                    Export
                                </button>
                            </div>
                        </div>
                        <div id="sequenceStartControl" class="hidden space-y-1">
                            <div class="flex justify-between text-xs">
                                <label class="text-gray-400">Start (cm)</label>
                                <input type="number" id="sequenceStartVal" min="0" max="48" value="0" step="0.01" class="value-input">
                            </div>
                            <input type="range" id="sequenceStart" min="0" max="48" value="0" step="0.01">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <label class="text-gray-400">Scale</label>
                            <input type="number" id="scaleVal" min="0.1" max="3" value="1.0" step="0.1" class="value-input">
                        </div>
                        <input type="range" id="scale" min="0.1" max="3" value="1.0" step="0.1">
                    </div>
                </div>

                <div class="space-y-3 pb-3 border-b border-gray-800">
                    <label class="text-xs font-bold uppercase text-gray-500 block">Rendering</label>

                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Blending</label>
                        <select id="blendMode">
                            <option value="NormalBlending" selected>Normal</option>
                            <option value="AdditiveBlending">Additive (Glow)</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <label class="text-gray-400">Opacity</label>
                            <input type="number" id="opacityVal" min="0.01" max="1" value="0.3" step="0.01" class="value-input">
                        </div>
                        <input type="range" id="opacity" min="0.01" max="1" value="0.3" step="0.01">
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <label class="text-gray-400">Dark Cutoff</label>
                            <input type="number" id="thresholdVal" min="0.0" max="0.9" value="0.02" step="0.001" class="value-input">
                        </div>
                        <input type="range" id="threshold" min="0.0" max="0.9" value="0.02" step="0.001">
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs">
                            <label class="text-gray-400">Bright Cutoff</label>
                            <input type="number" id="brightThresholdVal" min="0.1" max="1.0" value="1.0" step="0.01" class="value-input">
                        </div>
                        <input type="range" id="brightThreshold" min="0.1" max="1.0" value="1.0" step="0.01">
                    </div>
                </div>

                <div class="space-y-3 pb-3 border-b border-gray-800">
                    <label class="text-xs font-bold uppercase text-gray-500 block">Preview</label>

                    <div>
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Preview Angle</label>
                        <select id="previewAngle">
                            <option value="top" selected>Top Down</option>
                            <option value="default3d">Default 3D</option>
                        </select>
                    </div>

                    <div class="space-y-2 bg-gray-800/40 p-2 rounded border border-gray-800">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-[10px] text-gray-500 uppercase font-bold">Batch</span>
                            <span id="batchPreviewCount" class="text-[10px] text-blue-300 font-mono">0 folders</span>
                        </div>
                        <div class="grid grid-cols-3 gap-1">
                            <button type="button" id="batchAddFolderBtn" class="px-2 py-1 text-[10px] font-bold text-gray-300 bg-gray-900 hover:bg-gray-800 hover:text-white border border-gray-700 rounded transition-colors">
                                Add
                            </button>
                            <button type="button" id="batchAddParentBtn" class="px-2 py-1 text-[10px] font-bold text-gray-300 bg-gray-900 hover:bg-gray-800 hover:text-white border border-gray-700 rounded transition-colors">
                                Parent
                            </button>
                            <button type="button" id="batchClearBtn" class="px-2 py-1 text-[10px] font-bold text-gray-300 bg-gray-900 hover:bg-gray-800 hover:text-white border border-gray-700 rounded transition-colors">
                                Clear
                            </button>
                        </div>
                        <button type="button" id="batchRunBtn" class="w-full py-1.5 bg-gray-800 hover:bg-gray-700 rounded text-xs text-white border border-gray-700 transition-colors font-bold">
                            Run Batch
                        </button>
                        <div id="batchPreviewStatus" class="text-[10px] text-gray-500 font-mono truncate min-h-3"></div>
                        <button id="retryFailedBtn" type="button" disabled class="w-full bg-gray-800 rounded p-1 text-xs disabled:opacity-50">Retry failed previews</button>
                        <details class="text-[10px] text-gray-400"><summary>Batch results</summary><ul id="batchResults" class="space-y-1 mt-1"></ul></details>
                    </div>
                </div>
            </div>
        </div>

        <div id="import-footer" class="p-3 bg-black/50 border-t border-gray-800 space-y-2 shrink-0">
            <div class="grid grid-cols-[1fr_auto] gap-2">
                <label class="flex items-center justify-center min-w-0 cursor-pointer hover:bg-gray-800/60 transition-colors px-3 py-2 rounded border border-dashed border-gray-700 hover:border-blue-500 group">
                    <input type="file" id="videoInput" accept="video/*,image/*,.json,application/json" multiple class="hidden"/>
                    <span class="text-[10px] font-bold text-gray-400 group-hover:text-blue-400 truncate">Load Video / Images / JSON</span>
                </label>
                <button id="folderImportBtn" class="px-3 py-2 text-[10px] font-bold text-gray-500 hover:text-white bg-gray-900/70 border border-gray-700 hover:bg-gray-700 rounded transition-colors">
                    Folder
                </button>
            </div>

            <div class="grid grid-cols-[auto_1fr] gap-2">
                <button id="exportPreviewBtn" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-blue-100 text-xs font-bold rounded border border-blue-900/60 transition-colors">
                    Preview PNG
                </button>
                <button id="regenerateBtn" class="py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded shadow transition-colors">
                    Regenerate Stack
                </button>
            </div>

            <div id="statusContainer" class="hidden space-y-2">
                <div class="flex justify-between text-[10px] text-gray-400 font-mono">
                    <span id="statusText" role="status">PROCESSING...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-1.5 overflow-hidden">
                    <div id="progressBar" class="bg-blue-500 h-1.5 rounded-full transition-all duration-100" style="width: 0%"></div>
                </div>
                <button id="cancelProcessingBtn" class="w-full py-1.5 bg-gray-800 hover:bg-gray-700 rounded text-xs text-white border border-gray-700 transition-colors font-bold">
                    Cancel Processing
                </button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="./js/settings.js"></script>
    <script src="./js/viewport-trail.js"></script>
    <script src="./js/shaders.js"></script>
    <script src="./js/exports.js"></script>
    <script src="./js/batch.js"></script>
    <script src="./js/sources.js"></script>
    <script src="./js/source-transaction.js"></script>
    <script src="./js/workflow.js"></script>
    <script src="./js/app.js"></script>

</body>
</html>
